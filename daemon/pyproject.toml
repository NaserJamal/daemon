[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daemon"
version = "0.1.0"
description = "Minimal agentic coding harness for any OpenAI-compatible endpoint"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "daemon Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
daemon = "daemon.cli.main:main"

[project.urls]
Homepage = "https://github.com/naserjamal/daemon"
Repository = "https://github.com/naserjamal/daemon"

[tool.setuptools]
packages = [
    "daemon",
    "daemon.cli",
    "daemon.core",
    "daemon.safety",
    "daemon.tools",
]

[tool.setuptools.package-dir]
"daemon" = "."
"daemon.cli" = "cli"
"daemon.core" = "core"
"daemon.safety" = "safety"
"daemon.tools" = "tools"

[tool.setuptools.package-data]
daemon = ["pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
